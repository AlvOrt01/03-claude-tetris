name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Skip bots (avoid loops) and edits that don't touch title/body
    if: |
      github.event.sender.type != 'Bot' &&
      (github.event.action == 'opened' ||
        github.event.changes.title != null ||
        github.event.changes.body != null)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure triage labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "area:gameplay" --color "1d76db" --description "Mecánicas: piezas, colisión, rotación, líneas" --force
          gh label create "area:ui"       --color "5319e7" --description "Interfaz, render, estilos, HUD" --force
          gh label create "area:controls" --color "0e8a16" --description "Entrada de teclado / controles" --force
          gh label create "area:scoring"  --color "fbca04" --description "Puntaje, niveles, velocidad" --force
          gh label create "area:ci"       --color "c5def5" --description "Workflows, tooling, repo" --force
          gh label create "priority:high"   --color "b60205" --description "Prioridad alta" --force
          gh label create "priority:medium" --color "d93f0b" --description "Prioridad media" --force
          gh label create "priority:low"    --color "c2e0c6" --description "Prioridad baja" --force

      - name: Run Claude triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh api:*),Read,Glob,Grep,Write"'
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}
            EVENTO: ${{ github.event.action }}

            Eres el encargado de triage de este repositorio (Tetris en JavaScript vanilla: game.js, index.html, style.css; ver CLAUDE.md).
            Tu tarea: analizar el issue, asignar labels y publicar un diagnóstico técnico. NO modifiques código ni abras PRs.

            1. Lee el issue: `gh issue view ${{ github.event.issue.number }} --json title,body,labels`
            2. Lee los labels disponibles: `gh label list`
            3. Explora el código relevante (Read/Glob/Grep) para fundamentar el diagnóstico.

            4. Labels (usa SOLO labels existentes):
               - Exactamente 1 de tipo: bug | enhancement | documentation | question
               - 1 o más de área: area:gameplay | area:ui | area:controls | area:scoring | area:ci
               - Exactamente 1 de prioridad: priority:high | priority:medium | priority:low
               - Opcional: `good first issue` si es simple y acotado; `invalid`/`duplicate` solo si es evidente.
               Aplica con `gh issue edit ${{ github.event.issue.number }} --add-label "..."`.
               Si el evento es "edited", quita con `--remove-label` los labels de tipo/área/prioridad que ya no apliquen.

            5. Diagnóstico: escribe el cuerpo en un archivo (Write) `/tmp/triage.md`. La PRIMERA línea debe ser exactamente `<!-- claude-triage -->`. Formato en español:

               ## 🔍 Diagnóstico automático
               **Resumen:** ...
               **Clasificación:** tipo / área / prioridad, con justificación breve
               ### Análisis técnico
               Causa probable o enfoque, citando archivos y funciones concretas (ej. `game.js` → `collide`, `tryRotate`, `clearLines`).
               ### Archivos afectados
               ### Propuesta de solución
               Pasos concretos de implementación.
               ### Criterios de aceptación
               Checklist verificable.
               ### Preguntas abiertas
               Solo si falta información para implementar.

            6. Publica sin duplicar:
               - Busca comentario existente:
                 `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments --paginate --jq '.[] | select(.body | startswith("<!-- claude-triage -->")) | .id'`
               - Si existe un id: `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -F body=@/tmp/triage.md`
               - Si no: `gh issue comment ${{ github.event.issue.number }} --body-file /tmp/triage.md`
